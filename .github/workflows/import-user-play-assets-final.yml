name: Import Final User Asset Packs

on:
  push:
    branches: [asset-staging-user-upload]
    paths:
      - '.github/workflows/import-user-play-assets-final.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-staging-user-upload

      - name: Install downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Download exact official archives
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/download.py <<'PY'
          import asyncio, hashlib
          from pathlib import Path
          from urllib.parse import urljoin
          from playwright.async_api import async_playwright

          OUT=Path('/tmp/packs'); OUT.mkdir(parents=True,exist_ok=True)

          async def save_response(resp,path):
              body=await resp.body()
              Path(path).write_bytes(body)
              print(Path(path).name, len(body), hashlib.sha256(body).hexdigest())

          async def download_kenney(ctx,page,url,out_name):
              await page.goto(url,wait_until='domcontentloaded',timeout=120000)
              # Prefer a direct ZIP href when exposed by the page.
              links=page.locator('a[href]')
              for i in range(await links.count()):
                  a=links.nth(i)
                  href=await a.get_attribute('href')
                  if href and '.zip' in href.lower():
                      full=urljoin(page.url,href)
                      print('Kenney ZIP',full)
                      resp=await ctx.request.get(full,timeout=120000)
                      if resp.ok:
                          await save_response(resp,OUT/out_name)
                          return
              # Fallback to a download button that emits a browser download.
              buttons=page.locator('a,button')
              for i in range(await buttons.count()):
                  el=buttons.nth(i)
                  try: txt=(await el.inner_text()).strip().lower()
                  except: txt=''
                  if 'download' in txt:
                      try:
                          async with page.expect_download(timeout=60000) as info:
                              await el.click()
                          dl=await info.value
                          await dl.save_as(OUT/out_name)
                          p=OUT/out_name
                          print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
                          return
                      except Exception:
                          pass
              raise RuntimeError(f'Kenney download not found: {url}')

          async def download_tiny(page):
              await page.goto('https://tinytreats.itch.io/fun-playground/purchase',wait_until='domcontentloaded',timeout=120000)
              await page.locator('a.direct_download_btn').first.click()
              await page.wait_for_url('**/download/**',timeout=30000)
              btn=page.locator('a.download_btn[data-upload_id="13821463"]')
              if await btn.count()!=1:
                  raise RuntimeError('Tiny Treats upload button not found')
              async with page.expect_download(timeout=60000) as info:
                  await btn.click()
              dl=await info.value
              p=OUT/'Tiny_Treats_Fun_Playground_1.0_FREE.zip'
              await dl.save_as(p)
              print(p.name,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  ctx=await browser.new_context(accept_downloads=True,user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36')
                  page=await ctx.new_page()
                  await download_tiny(page)
                  await download_kenney(ctx,page,'https://kenney.nl/assets/furniture-kit','kenney_furniture-kit.zip')
                  await download_kenney(ctx,page,'https://kenney.nl/assets/mini-arcade','kenney_mini-arcade.zip')
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/download.py

          echo "Verifying exact archives against inspected user uploads..."
          echo "7031b39f515895eab950cd79b197bc9c0d68106c5738272957075cc664ca3294  /tmp/packs/Tiny_Treats_Fun_Playground_1.0_FREE.zip" | sha256sum -c -
          echo "e67652d0932cee41683f74711c03d3e192a2af9979ef8e6b237711f5482d46b0  /tmp/packs/kenney_furniture-kit.zip" | sha256sum -c -
          echo "2acfe5cb44d392e834f77cf5488528c7cd45427cdf5fb941ce99856276158c19  /tmp/packs/kenney_mini-arcade.zip" | sha256sum -c -

      - name: Extract web-ready files only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tiny /tmp/furniture /tmp/arcade
          mkdir -p /tmp/tiny /tmp/furniture /tmp/arcade
          unzip -q /tmp/packs/Tiny_Treats_Fun_Playground_1.0_FREE.zip -d /tmp/tiny
          unzip -q /tmp/packs/kenney_furniture-kit.zip -d /tmp/furniture
          unzip -q /tmp/packs/kenney_mini-arcade.zip -d /tmp/arcade

          rm -rf assets/imported/playground/tiny-treats-fun-playground
          rm -rf assets/imported/furniture/kenney-furniture-kit
          rm -rf assets/imported/arcade/kenney-mini-arcade
          mkdir -p assets/imported/playground/tiny-treats-fun-playground
          mkdir -p assets/imported/furniture/kenney-furniture-kit
          mkdir -p assets/imported/arcade/kenney-mini-arcade

          TROOT="$(find /tmp/tiny -type d -path '*/Assets/gltf' -print -quit)"
          test -n "$TROOT"
          cp -a "$TROOT"/. assets/imported/playground/tiny-treats-fun-playground/
          cp "$(find /tmp/tiny -type f -name License.txt -print -quit)" assets/imported/playground/tiny-treats-fun-playground/License.txt

          FROOT="$(find /tmp/furniture -type d -path '*/Models/GLTF format' -print -quit)"
          test -n "$FROOT"
          cp -a "$FROOT"/*.glb assets/imported/furniture/kenney-furniture-kit/
          cp "$(find /tmp/furniture -type f -name License.txt -print -quit)" assets/imported/furniture/kenney-furniture-kit/License.txt

          AROOT="$(find /tmp/arcade -type d -path '*/Models/GLB format' -print -quit)"
          test -n "$AROOT"
          cp -a "$AROOT"/*.glb assets/imported/arcade/kenney-mini-arcade/
          if [ -d "$AROOT/Textures" ]; then cp -a "$AROOT/Textures" assets/imported/arcade/kenney-mini-arcade/; fi
          cp "$(find /tmp/arcade -type f -name License.txt -print -quit)" assets/imported/arcade/kenney-mini-arcade/License.txt

          TINY_GLTF=$(find assets/imported/playground/tiny-treats-fun-playground -name '*.gltf' | wc -l)
          FURN_GLB=$(find assets/imported/furniture/kenney-furniture-kit -name '*.glb' | wc -l)
          ARCADE_GLB=$(find assets/imported/arcade/kenney-mini-arcade -name '*.glb' | wc -l)
          echo "Tiny Treats glTF models: $TINY_GLTF"
          echo "Kenney Furniture GLB models: $FURN_GLB"
          echo "Kenney Mini Arcade GLB models: $ARCADE_GLB"
          test "$TINY_GLTF" -eq 47
          test "$FURN_GLB" -eq 140
          test "$ARCADE_GLB" -eq 20

          cat >> assets/imported/README.md <<'EOF'

          ## Tiny Treats - Fun Playground
          - Folder: playground/tiny-treats-fun-playground/
          - 47 game-ready glTF models with their BIN buffers and atlas texture.
          - Includes slides, swings, seesaws, monkey bars, merry-go-round, spring horses, stepping stumps, sandboxes and props.
          - Source: https://tinytreats.itch.io/fun-playground
          - Licence: CC0 1.0 Universal.
          - Archive checksum matched the user's inspected upload.

          ## Kenney Furniture Kit
          - Folder: furniture/kenney-furniture-kit/
          - 140 game-ready GLB models.
          - Source: https://kenney.nl/assets/furniture-kit
          - Licence: CC0 1.0 Universal.
          - Archive checksum matched the user's inspected upload.

          ## Kenney Mini Arcade
          - Folder: arcade/kenney-mini-arcade/
          - 20 game-ready GLB models plus the shared colormap texture.
          - Includes air hockey, arcade machine, basketball game, claw machine, dance machine, pinball, prize wheel, ticket machine, prizes, walls and two animated characters.
          - Source: https://kenney.nl/assets/mini-arcade
          - Licence: CC0 1.0 Universal.
          - Archive checksum matched the user's inspected upload.
          EOF

      - name: Commit assets and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/import-user-play-assets.yml
          rm -f .github/workflows/import-user-play-assets-final.yml
          rm -f .github/workflows/inspect-tiny-download.yml
          rm -f .github/workflows/inspect-tiny-download2.yml
          rm -f .github/workflows/inspect-tiny-html.yml
          git add -A assets/imported .github/workflows
          git commit -m "assets: add playground, furniture and mini arcade packs"
          git push origin HEAD:asset-staging-user-upload
