name: Build Decor Update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-decor-update.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist index.html
          git rm -f .github/workflows/build-decor-update.yml
          git commit -m "build: publish imported decor update"
          git push
