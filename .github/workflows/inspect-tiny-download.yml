name: Inspect Tiny Download

on:
  push:
    branches: [asset-staging-user-upload]
    paths:
      - '.github/workflows/inspect-tiny-download.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - run: |
          cat > /tmp/i.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              pg=await b.new_page(accept_downloads=True)
              await pg.goto('https://tinytreats.itch.io/fun-playground/purchase', wait_until='domcontentloaded', timeout=120000)
              skip=pg.get_by_text('No thanks, just take me to the downloads')
              if await skip.count(): await skip.first.click(); await pg.wait_for_load_state('domcontentloaded')
              print('URL',pg.url)
              print('IDHTML', await pg.locator('#game_download_4715007').evaluate('(e)=>e.outerHTML') if await pg.locator('#game_download_4715007').count() else 'NOID')
              els=pg.locator('a,button,input')
              for i in range(await els.count()):
                el=els.nth(i)
                try:
                  txt=(await el.inner_text()).strip()
                except: txt=''
                attrs=await el.evaluate('(e)=>({tag:e.tagName,href:e.getAttribute("href"),cls:e.className,id:e.id,type:e.getAttribute("type"),data:Object.fromEntries([...e.attributes].filter(a=>a.name.startsWith("data-")).map(a=>[a.name,a.value]))})')
                if '4715007' in str(attrs) or 'download' in txt.lower() or 'free'==txt.lower():
                  print('EL',i,repr(txt),attrs)
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/i.py
