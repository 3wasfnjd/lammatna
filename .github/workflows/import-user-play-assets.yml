name: Import User Play Assets

on:
  push:
    branches: [asset-staging-user-upload]
    paths:
      - '.github/workflows/import-user-play-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-staging-user-upload

      - name: Set up browser downloader
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Download official packages
        shell: bash
        run: |
          cat > /tmp/download_assets.py <<'PY'
          import asyncio, re, hashlib
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path("/tmp/downloads")
          OUT.mkdir(parents=True, exist_ok=True)

          async def save_download(download, name):
              path = OUT / name
              await download.save_as(path)
              print(name, "bytes", path.stat().st_size, "sha256", hashlib.sha256(path.read_bytes()).hexdigest())
              return path

          async def download_tiny(page):
              await page.goto("https://tinytreats.itch.io/fun-playground/purchase", wait_until="domcontentloaded", timeout=120000)
              print("TINY purchase title:", await page.title())
              # Skip optional payment.
              skip = page.get_by_text(re.compile(r"No thanks.*downloads", re.I))
              if await skip.count():
                  await skip.first.click()
                  await page.wait_for_load_state("domcontentloaded")
              print("TINY download page:", page.url)
              # Prefer a download control whose visible text contains Free.
              candidates = page.locator("a, button")
              n = await candidates.count()
              for i in range(n):
                  el = candidates.nth(i)
                  try:
                      text = (await el.inner_text()).strip()
                      href = await el.get_attribute("href")
                  except Exception:
                      continue
                  if re.search(r"\bFree\b", text, re.I):
                      print("TINY candidate", i, repr(text), href)
                      try:
                          async with page.expect_download(timeout=30000) as info:
                              await el.click()
                          return await save_download(await info.value, "Tiny_Treats_Fun_Playground_1.0_FREE.zip")
                      except Exception as e:
                          print("TINY free click did not download:", e)
              # Fallback: any direct .zip/download-looking link.
              for i in range(n):
                  el = candidates.nth(i)
                  href = await el.get_attribute("href")
                  if href and (".zip" in href.lower() or "download" in href.lower()):
                      print("TINY fallback href", href)
                      try:
                          async with page.expect_download(timeout=30000) as info:
                              await el.click()
                          return await save_download(await info.value, "Tiny_Treats_Fun_Playground_1.0_FREE.zip")
                      except Exception:
                          pass
              print((await page.locator("body").inner_text())[:10000])
              raise RuntimeError("Could not find Tiny Treats free download")

          async def download_kenney(page):
              await page.goto("https://kenney.nl/assets/furniture-kit", wait_until="domcontentloaded", timeout=120000)
              print("KENNEY page title:", await page.title())
              links = page.locator("a")
              n = await links.count()
              # Find direct ZIP first.
              for i in range(n):
                  a = links.nth(i)
                  href = await a.get_attribute("href")
                  text = (await a.inner_text()).strip()
                  if href and ("kenney_furniture-kit.zip" in href or href.lower().endswith(".zip")):
                      print("KENNEY direct candidate", repr(text), href)
                      async with page.expect_download(timeout=60000) as info:
                          await a.click()
                      return await save_download(await info.value, "kenney_furniture-kit.zip")
              # Otherwise click a download control.
              for pattern in [r"^Download$", r"Download"]:
                  loc = page.get_by_text(re.compile(pattern, re.I))
                  if await loc.count():
                      for i in range(await loc.count()):
                          try:
                              async with page.expect_download(timeout=60000) as info:
                                  await loc.nth(i).click()
                              return await save_download(await info.value, "kenney_furniture-kit.zip")
                          except Exception as e:
                              print("KENNEY click attempt:", e)
              print((await page.locator("body").inner_text())[:10000])
              raise RuntimeError("Could not find Kenney download")

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      accept_downloads=True,
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
                  )
                  page = await context.new_page()
                  await download_tiny(page)
                  await download_kenney(page)
                  await browser.close()

          asyncio.run(main())
          PY
          python /tmp/download_assets.py

      - name: Verify and select web-ready formats
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/downloads

          # Compare with the exact archives inspected from the user's uploads.
          TINY_SHA="$(sha256sum Tiny_Treats_Fun_Playground_1.0_FREE.zip | cut -d' ' -f1)"
          KENNEY_SHA="$(sha256sum kenney_furniture-kit.zip | cut -d' ' -f1)"
          echo "Tiny SHA:   $TINY_SHA"
          echo "Kenney SHA: $KENNEY_SHA"

          test "$TINY_SHA" = "7031b39f515895eab950cd79b197bc9c0d68106c5738272957075cc664ca3294"
          test "$KENNEY_SHA" = "e67652d0932cee41683f74711c03d3e192a2af9979ef8e6b237711f5482d46b0"

          rm -rf /tmp/tiny /tmp/kenney
          mkdir -p /tmp/tiny /tmp/kenney
          unzip -q Tiny_Treats_Fun_Playground_1.0_FREE.zip -d /tmp/tiny
          unzip -q kenney_furniture-kit.zip -d /tmp/kenney

          TROOT="$(find /tmp/tiny -type d -path '*/Assets/gltf' -print -quit)"
          test -n "$TROOT"

          mkdir -p assets/imported/playground/tiny-treats-fun-playground
          mkdir -p assets/imported/furniture/kenney-furniture-kit

          cp -a "$TROOT"/. assets/imported/playground/tiny-treats-fun-playground/
          TLIC="$(find /tmp/tiny -type f -name 'License.txt' -print -quit)"
          cp "$TLIC" assets/imported/playground/tiny-treats-fun-playground/License.txt

          KROOT="$(find /tmp/kenney -type d -path '*/Models/GLTF format' -print -quit)"
          test -n "$KROOT"
          cp -a "$KROOT"/. assets/imported/furniture/kenney-furniture-kit/
          KLIC="$(find /tmp/kenney -type f -name 'License.txt' -print -quit)"
          cp "$KLIC" assets/imported/furniture/kenney-furniture-kit/License.txt

          echo "Tiny glTF: $(find assets/imported/playground/tiny-treats-fun-playground -name '*.gltf' | wc -l)"
          echo "Tiny BIN:  $(find assets/imported/playground/tiny-treats-fun-playground -name '*.bin' | wc -l)"
          echo "Kenney GLB: $(find assets/imported/furniture/kenney-furniture-kit -name '*.glb' | wc -l)"

          test "$(find assets/imported/playground/tiny-treats-fun-playground -name '*.gltf' | wc -l)" -eq 47
          test "$(find assets/imported/furniture/kenney-furniture-kit -name '*.glb' | wc -l)" -eq 140

          cat >> assets/imported/README.md <<'EOF'

          ## Tiny Treats – Fun Playground
          - Folder: playground/tiny-treats-fun-playground/
          - 47 game-ready glTF models plus BIN buffers and one atlas texture.
          - Includes slides, swings, seesaws, monkey bars, merry-go-round, spring horses, stepping stumps, sandboxes and props.
          - Source: https://tinytreats.itch.io/fun-playground
          - Licence: CC0 1.0 Universal.
          - Imported from the exact free archive inspected from the user's upload.

          ## Kenney Furniture Kit
          - Folder: furniture/kenney-furniture-kit/
          - 140 game-ready GLB models.
          - Includes chairs, sofas, tables, desks, shelves, counters, kitchen/bathroom fixtures, lighting and interior props.
          - Source: https://kenney.nl/assets/furniture-kit
          - Licence: CC0 1.0 Universal.
          - Imported from the exact archive inspected from the user's upload.
          EOF

      - name: Commit selected assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imported
          git rm -f .github/workflows/import-user-play-assets.yml
          git commit -m "assets: add Tiny Treats playground and Kenney furniture"
          git push origin HEAD:asset-staging-user-upload
