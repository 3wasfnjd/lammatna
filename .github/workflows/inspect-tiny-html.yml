name: Inspect Tiny HTML
on:
  push:
    branches: [asset-staging-user-upload]
    paths: ['.github/workflows/inspect-tiny-html.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          curl -L -A 'Mozilla/5.0' -sS 'https://tinytreats.itch.io/fun-playground/purchase' -o /tmp/p.html
          echo SIZE=$(wc -c </tmp/p.html)
          grep -n -E -C 4 'direct_download_btn|game_download|4715007|download_token|upload_id|download_url' /tmp/p.html | head -300 || true
