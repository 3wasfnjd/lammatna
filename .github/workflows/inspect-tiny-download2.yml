name: Inspect Tiny Download 2

on:
  push:
    branches: [asset-staging-user-upload]
    paths:
      - '.github/workflows/inspect-tiny-download2.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - run: |
          cat > /tmp/i.py <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              pg=await b.new_page(accept_downloads=True)
              pg.on('request', lambda req: print('REQ', req.method, req.url) if ('download' in req.url or 'file' in req.url or 'upload' in req.url) else None)
              pg.on('response', lambda res: print('RES', res.status, res.url) if ('download' in res.url or 'file' in res.url or 'upload' in res.url) else None)
              await pg.goto('https://tinytreats.itch.io/fun-playground/purchase', wait_until='domcontentloaded', timeout=120000)
              skip=pg.locator('a.direct_download_btn')
              print('skip count',await skip.count())
              await skip.first.click()
              await pg.wait_for_timeout(3500)
              print('URL2',pg.url)
              print('BODYHEAD',(await pg.locator('body').inner_text())[:1500])
              print('IDCOUNT',await pg.locator('#game_download_4715007').count())
              if await pg.locator('#game_download_4715007').count():
                print('IDHTML',await pg.locator('#game_download_4715007').evaluate('(e)=>e.outerHTML'))
              els=pg.locator('a,button,input')
              for i in range(await els.count()):
                el=els.nth(i)
                try: txt=(await el.inner_text()).strip()
                except: txt=''
                attrs=await el.evaluate('(e)=>({tag:e.tagName,outer:e.outerHTML.slice(0,1000),href:e.getAttribute("href"),cls:e.className,id:e.id,type:e.getAttribute("type"),data:Object.fromEntries([...e.attributes].filter(a=>a.name.startsWith("data-")).map(a=>[a.name,a.value]))})')
                if '4715007' in str(attrs) or 'download' in txt.lower() or txt.lower()=='free':
                  print('EL',i,repr(txt),attrs)
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/i.py
